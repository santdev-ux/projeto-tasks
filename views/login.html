<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Monitoramento de Ambientes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body class="bg-light">
  <main class="container d-flex justify-content-center align-items-center min-vh-100">
    <form method="POST" action="/login" class="card p-4 shadow-sm" style="width:100%;max-width:380px">
      <h1 class="h4 mb-3 text-center">Entrar</h1>
      <div id="erro" class="alert alert-danger d-none">E-mail ou senha incorretos</div>
      <input name="email" type="email" class="form-control mb-3" placeholder="E-mail" required>
      <input name="senha" type="password" class="form-control mb-3" placeholder="Senha" required>
      <button type="submit" class="btn btn-success w-100">Entrar</button>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('erro')) {
      document.getElementById('erro').classList.remove('d-none');
    }
  </script>
</body>
</html>
